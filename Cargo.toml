[workspace]
members = ["switcherooctl", "switcheroo-daemon", "switcheroo-common"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LuMarans30/switcheroo-control-rs"

[workspace.dependencies]
color-eyre = "0.6.5"
zbus = "4.0"
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
udev = { version = "0.9.3", features = ["sync"] }
regex = "1.12.4"
nix = { version = "0.31.3", features = ["ioctl"] }
futures-lite = "2.6.1"
switcheroo-common = { path = "switcheroo-common" }

[workspace.lints.clippy]
pedantic = "warn"

[workspace]
members = ["switcherooctl", "switcheroo-daemon", "switcheroo-common"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://gitlab.freedesktop.org/hadess/switcheroo-control"

[workspace.dependencies]
color-eyre = "0.6.5"
zbus = "4.0"
tokio = { version = "1.52.3", features = ["full", "signal"] }

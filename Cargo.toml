[workspace]
members = ["switcherooctl", "switcheroo-daemon", "switcheroo-common"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LuMarans30/switcheroo-control-rs"

[workspace.dependencies]
color-eyre = "0.6.5"
zbus = "5.19"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
udev = { version = "0.9.3", features = ["sync"] }
regex = "1.13.1"
nix = { version = "0.31.3", features = ["ioctl"] }
futures-lite = "2.6.1"
log = "0.4.34"
env_logger = "0.11.11"
systemd-journal-logger = "2.2.2"
switcheroo-common = { path = "switcheroo-common", version = "0.1.3" }

[workspace.lints.clippy]
pedantic = "warn"
